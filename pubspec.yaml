name: verdio
description: "Aplicación móvil para la administración financiera personal."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.0
  google_sign_in: ^6.2.1
  intl: ^0.20.3
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/currencies.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_verdio.jpeg"